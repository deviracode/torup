project_id = "queue-management"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# Per-environment values are injected via env() at `config push` time.
# Provide them through .env.staging / .env.production (see scripts/push-config.sh).
site_url = "env(SUPABASE_AUTH_SITE_URL)"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "env(SUPABASE_AUTH_WEB_URL_WILDCARD)",
  "env(SUPABASE_AUTH_WEB_URL_CALLBACK)",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
